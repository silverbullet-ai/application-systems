<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create and share personalised Deepawali greetings with your loved ones.">

    <title>Deepawali Wishes | By Aahish</title>

    <!-- CSS Stylesheets -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/animations.css') }}">

</head>

<body>

    <!-- Floating Golden Particles -->

    <div class="particles" id="particles"></div>


    <main class="container">


        <!-- ============================= -->
        <!-- HEADER SECTION                -->
        <!-- ============================= -->

        <header class="hero">

            <!-- Animated Diyas -->

            <div class="diya-row">

                <div class="diya">
                    <div class="flame"></div>
                    <div class="lamp"></div>
                </div>

                <div class="diya">
                    <div class="flame"></div>
                    <div class="lamp"></div>
                </div>

                <div class="diya">
                    <div class="flame"></div>
                    <div class="lamp"></div>
                </div>

            </div>


            <p class="subtitle">
                THE FESTIVAL OF LIGHTS
            </p>

            <h1>शुभ दीपावली</h1>

            <h2>Happy Deepawali</h2>

            <p class="description">
                A little light, a little love,
                and a personalised wish for someone special.
            </p>

        </header>


        <!-- ============================= -->
        <!-- GREETING CREATION FORM        -->
        <!-- ============================= -->

        <section class="greeting-section">

            <form id="greetingForm">

                <label for="senderName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="senderName"
                    placeholder="Who is sending the wish?"
                    maxlength="50"
                    autocomplete="name"
                    required
                >


                <label for="recipientName">
                    Recipient's Name
                </label>

                <input
                    type="text"
                    id="recipientName"
                    placeholder="Who is receiving the wish?"
                    maxlength="50"
                    required
                >


                <button type="submit" id="generateButton">
                    ✨ Generate My Wish
                </button>

            </form>


            <!-- ============================= -->
            <!-- GENERATED GREETING CARD       -->
            <!-- ============================= -->

            <div id="greetingResult"
                 class="greeting-card"
                 hidden>


                <!-- Card Decoration -->

                <div class="card-diya">
                    🪔
                </div>


                <!-- Personalised Greeting -->

                <h2 id="greetingTitle"></h2>

                <p id="greetingWish"></p>

                <p id="greetingBlessing"></p>

                <p id="greetingClosing"></p>


                <!-- Dynamic Sender Signature -->

                <div class="signature"></div>


                <!-- ============================= -->
                <!-- SENDER ACTIONS                -->
                <!-- ============================= -->

                <div id="cardActions">

                    <button type="button" id="copyButton">
                        📋 Copy Greeting
                    </button>

                    <button type="button" id="shareButton">
                        💚 Share on WhatsApp
                    </button>

                    <button type="button" id="regenerateButton">
                        ✨ Generate Another Wish
                    </button>

                </div>


                <!-- ============================= -->
                <!-- RECIPIENT ACTION              -->
                <!-- ============================= -->

                <button
                    type="button"
                    id="createOwnWishButton"
                    hidden
                >
                    ✨ Create Your Own Wish
                </button>


            </div>

        </section>


        <!-- ============================= -->
        <!-- FOOTER                        -->
        <!-- ============================= -->

        <footer>

            <p>
                Made with ❤️ and a little Python magic.
            </p>

            <p>
                © 2026 Deepawali Wishes
            </p>

            <p class="creator">
                Created by Aahish
            </p>

        </footer>


    </main>


    <!-- ============================= -->
    <!-- JAVASCRIPT FILES               -->
    <!-- ============================= -->

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <script src="{{ url_for('static', filename='js/effects.js') }}"></script>


</body>

</html>
